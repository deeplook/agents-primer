[project]
name = "agents-primer"
version = "0.1.0"
description = "Small executable lessons for workflow-oriented agents with the OpenAI Agents SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["openai-agents>=0.7"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
